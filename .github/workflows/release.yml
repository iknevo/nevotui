name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: build linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu,x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: goto-bus-stop/setup-zig@v2
      - name: Install cargo-zigbuild
        run: |
          pip3 install --user cargo-zigbuild
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build linux x64 glibc
        run: node scripts/build.mjs --tool cargo x86_64-unknown-linux-gnu
      - name: Build linux arm64 glibc + musl
        run: node scripts/build.mjs --tool cargo-zigbuild aarch64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/npm
          if-no-files-found: error

  build-macos:
    name: build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - name: Build darwin x64 + arm64
        run: node scripts/build.mjs --tool cargo aarch64-apple-darwin x86_64-apple-darwin
      - uses: actions/upload-artifact@v4
        with:
          name: dist-darwin
          path: dist/npm
          if-no-files-found: error

  build-windows:
    name: build windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build windows x64
        run: node scripts/build.mjs --tool cargo x86_64-pc-windows-msvc
      - uses: actions/upload-artifact@v4
        with:
          name: dist-win32
          path: dist/npm
          if-no-files-found: error

  publish:
    name: publish to npm + GitHub
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos, build-windows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/npm
          merge-multiple: true
      - name: Check tag matches package version
        shell: bash
        run: |
          VER=$(node -e "process.stdout.write(JSON.parse(require('child_process').execSync('cargo metadata --no-deps --format-version=1').toString()).packages[0].version)")
          if [ "${GITHUB_REF_NAME#v}" != "$VER" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${VER}" >&2
            exit 1
          fi
      - name: Publish packages to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          node scripts/publish.mjs
      - name: Create GitHub release
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/npm/*/bin/nevotui* --title "$GITHUB_REF_NAME" --generate-notes